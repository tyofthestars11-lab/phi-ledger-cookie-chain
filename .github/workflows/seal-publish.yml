name: seal-publish

# Golden Angle Anti-Run-Fail: Pages deploys must never cancel each other.
# Rapid pushes used to cancel the previous Pages run, giving run canceled
# then a later run succeeded - fail then succeed, not single green.
# cancel-in-progress: false queues Pages runs instead of canceling them.
concurrency:
  group: seal-publish-main
  cancel-in-progress: false

# General run-fail fix: Pages deploy needs these, even when the job only verifies.
permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: regression tests
        run: python3 -m unittest test_phi_ledger_fails -v
      - name: verify snapshot integrity
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, '.')
          import hash_snapshot, json
          d = json.load(open('ledger-snapshot.json'))
          h = hash_snapshot.compute('ledger-snapshot.json')
          assert d.get('snapshot_sha256') == h, f"hash MISMATCH published={d.get('snapshot_sha256')} recomputed={h}"
          assert d['seal_count'] == len(d['seals']), 'seal_count mismatch'
          assert d['entry_count'] == len(d['entries']), 'entry_count mismatch'
          print(f"hash MATCH {h[:8]} | seal_count={d['seal_count']} entry_count={d['entry_count']} OK")
          EOF

  # Pages wait: a run is green only when the live site reads the version
  # this push carries. Pages deploys lag the push, so a stale read (for
  # example v95 while the push carries v96) must WAIT, never fail.
  # The version is read from index.html, never hardcoded, so the same
  # loop waits for v96 then and v97 now. Final verdict is one green run.
  wait-pages:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: wait for Pages to serve this push
        run: |
          PAGES_URL="https://tyofthestars11-lab.github.io/phi-ledger-cookie-chain/"
          echo "waiting for Pages to serve phi version infinite with chainId cookie-chain"
          for i in $(seq 1 60); do
            PAGE=$(curl -s -L "$PAGES_URL" || true)
            APPJS=$(curl -s -L "${PAGES_URL}app.js" || true)
            if echo "$PAGE" | grep -q 'src="app.js"' && echo "$APPJS" | grep -q "chainId: 'cookie-chain'"; then
              echo "PAGES LIVE phi version infinite chainId cookie-chain"
              exit 0
            fi
            echo "attempt $i/60: Pages not yet live, waiting 30s (stale is a wait, not a failure)"
            sleep 30
          done
          echo "Pages did not serve phi version infinite within 30 minutes" && exit 1
