<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>φ Rung Calculator — PHI LEDGER</title>
<meta name="description" content="Scale-invariant rung addresses and base-φ codec. to_rung(x) = ln(x)/ln(φ).">
<style>
  body { background:#0a0a0f; color:#e8e6df; font-family: ui-sans-serif, system-ui, sans-serif; margin:0; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
  .gold { color:#e8b93c; } .gold-dim { color:#9a7b28; }
  .card { background:#12121a; border:1px solid #26263a; border-radius:14px; padding:20px; margin-bottom:20px; }
  .mono { font-family: ui-monospace, monospace; }
  input[type=text] { background:#1a1a26; border:1px solid #33334d; border-radius:8px; padding:10px 12px; color:#e8e6df; width:100%; box-sizing:border-box; font-size:16px; }
  .btn { background:#e8b93c; color:#0a0a0f; font-weight:700; border:none; border-radius:10px; padding:10px 18px; cursor:pointer; font-size:15px; }
  .chip { display:inline-block; border:1px solid #e8b93c; color:#e8b93c; border-radius:9999px; padding:4px 12px; margin:4px 4px 0 0; cursor:pointer; font-size:13px; }
  .out { background:#0a0a0f; border:1px solid #26263a; border-radius:8px; padding:12px; margin-top:12px; word-break:break-all; }
  a { color:#e8b93c; }
  h1 { font-size:28px; margin:0 0 4px 0; }
  h2 { font-size:18px; margin:0 0 12px 0; }
  .sub { color:#888; font-size:14px; margin-bottom:24px; }
  .row { display:flex; gap:8px; margin-top:12px; }
  .row input { flex:1; }
  label { font-size:13px; color:#aaa; display:block; margin-bottom:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="gold">φ</span> Rung Calculator</h1>
  <p class="sub">to_rung(x) = ln(x) / ln(φ) · base-φ codec · <a href="index.html">back to PHI LEDGER</a></p>

  <div class="card">
    <h2><span class="gold">Rung address</span></h2>
    <label>Enter any positive number</label>
    <div class="row">
      <input type="text" id="rungIn" placeholder="e.g. 16569" inputmode="decimal">
      <button class="btn" onclick="calcRung()">Rung</button>
    </div>
    <div>
      <span class="chip" onclick="setRung(16569)">16569</span>
      <span class="chip" onclick="setRung(539120)">539120</span>
      <span class="chip" onclick="setRung(310)">310</span>
      <span class="chip" onclick="setRung(99)">99</span>
      <span class="chip" onclick="setRung(266)">266</span>
      <span class="chip" onclick="setRung(144)">144</span>
    </div>
    <div class="out mono" id="rungOut">…</div>
  </div>

  <div class="card">
    <h2><span class="gold">Base-φ codec</span></h2>
    <label>Integer → phinary (no consecutive ones, ever)</label>
    <div class="row">
      <input type="text" id="encIn" placeholder="e.g. 144" inputmode="numeric">
      <button class="btn" onclick="encode()">Encode</button>
    </div>
    <div class="out mono" id="encOut">…</div>
    <label style="margin-top:16px">Phinary → integer</label>
    <div class="row">
      <input type="text" id="decIn" placeholder="e.g. 10001000100.0100010001" inputmode="text">
      <button class="btn" onclick="decode()">Decode</button>
    </div>
    <div class="out mono" id="decOut">…</div>
  </div>

  <p class="sub">φ² = φ + 1 · the double-one always collapses: 011<sub>φ</sub> → 100<sub>φ</sub></p>
</div>

<script>
const PHI = (1 + Math.sqrt(5)) / 2;
const LN_PHI = Math.log(PHI);
const toRung = x => Math.log(x) / LN_PHI;

function calcRung() {
  const v = parseFloat(document.getElementById('rungIn').value);
  const out = document.getElementById('rungOut');
  if (!(v > 0)) { out.textContent = 'positive numbers only'; return; }
  const r = toRung(v);
  const near = Math.round(r);
  out.innerHTML = 'rung <span class="gold">' + r.toFixed(10) + '</span>' +
    ' &nbsp;·&nbsp; nearest φ-power: φ<sup>' + near + '</sup> ≈ ' + Math.pow(PHI, near).toPrecision(10);
}
function setRung(v) { document.getElementById('rungIn').value = v; calcRung(); }

function toPhinary(n, fracDigits) {
  fracDigits = fracDigits || 14;
  if (!(n > 0) || !Number.isInteger(n)) throw new Error('positive integers only');
  let k = 0;
  while (Math.pow(PHI, k + 1) <= n) k++;
  const idx = [];
  for (let i = k + 1; i >= -fracDigits; i--) idx.push(i);
  const digits = {};
  idx.forEach(i => digits[i] = 0);
  let rem = n;
  for (const i of idx) {
    const p = Math.pow(PHI, i);
    if (p <= rem + 1e-9) { digits[i] = 1; rem -= p; }
  }
  let d = idx.map(i => digits[i]);
  for (;;) {
    const s = d.join('');
    const j = s.indexOf('011');
    if (j === -1) break;
    d[j] = 1; d[j+1] = 0; d[j+2] = 0;
  }
  let intpart = d.slice(0, k + 2).join('').replace(/^0+/, '') || '0';
  let fracpart = d.slice(k + 2).join('').replace(/0+$/, '');
  return fracpart ? intpart + '.' + fracpart : intpart;
}
function fromPhinary(s) {
  s = s.trim();
  if (!/^[01]+(\.[01]+)?$/.test(s)) throw new Error('digits must be 0/1');
  const parts = s.split('.');
  const ip = parts[0], fp = parts[1] || '';
  let total = 0;
  Array.from(ip).reverse().forEach((ch, i) => { if (ch === '1') total += Math.pow(PHI, i); });
  Array.from(fp).forEach((ch, i) => { if (ch === '1') total += Math.pow(PHI, -(i + 1)); });
  return total;
}
function encode() {
  const out = document.getElementById('encOut');
  try {
    const n = Number(document.getElementById('encIn').value);
    const e = toPhinary(n);
    const back = Math.round(fromPhinary(e));
    out.innerHTML = '<span class="gold">' + e + '</span><br>round-trip: ' +
      back + (back === n ? ' ✓' : ' <span style="color:#f66">MISMATCH</span>') +
      (e.indexOf('11') === -1 ? ' · no consecutive ones ✓' : ' <span style="color:#f66">has 11</span>');
  } catch (err) { out.textContent = err.message; }
}
function decode() {
  const out = document.getElementById('decOut');
  try {
    const v = fromPhinary(document.getElementById('decIn').value);
    out.innerHTML = '<span class="gold">' + v.toPrecision(12) + '</span>' +
      (Math.abs(v - Math.round(v)) < 1e-6 ? '<br>integer: ' + Math.round(v) : '');
  } catch (err) { out.textContent = err.message; }
}
document.getElementById('rungIn').addEventListener('keydown', e => { if (e.key === 'Enter') calcRung(); });
document.getElementById('encIn').addEventListener('keydown', e => { if (e.key === 'Enter') encode(); });
document.getElementById('decIn').addEventListener('keydown', e => { if (e.key === 'Enter') decode(); });
</script>
</body>
</html>
