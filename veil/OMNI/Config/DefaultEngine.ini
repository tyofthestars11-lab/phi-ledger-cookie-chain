[/Script/EngineSettings.GameMapsSettings]
; OMNI ships no level assets: the GameMode builds the world at runtime
; (AOMNIWorldBuilder), so it must be the global default on EVERY map,
; including the editor's empty Untitled map.
GlobalDefaultGameMode=/Script/OMNI.OMNIGameMode
GameInstanceClass=/Script/Engine.GameInstance

[/Script/Engine.RendererSettings]
; Tuned for RTX 3050 6 GB (Tyree's rig): dynamic resolution carries the frame,
; lumen stays available but the prototype ships with it softened in scalability.
r.DynamicRes.OperationMode=Enabled
r.DynamicRes.MinScreenPercentage=59
r.DynamicRes.MaxScreenPercentage=100
r.AllowStaticLighting=True
r.GenerateMeshDistanceFields=False
r.Shadow.Virtual.Enable=0

